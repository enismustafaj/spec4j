on:
  pull_request:
    paths: ['**/*.tsp']
  push:
    branches: [main]
    paths: ['**/*.tsp']

# Compile-check only. No publish here — publish happens off release tags,
# see publish.yaml. This just keeps main from merging a broken spec.
jobs:
  changed-specs:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.all_changed_files }}
      any: ${{ steps.changed.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
      - id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: '**/*.tsp'

  validate:
    needs: changed-specs
    if: needs.changed-specs.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec: ${{ fromJson(needs.changed-specs.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @typespec/compiler @typespec/http @typespec/rest @typespec/openapi3
      - run: tsp compile "${{ matrix.spec }}"
